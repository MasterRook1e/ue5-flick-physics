name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-boundary:
    name: Repository boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository boundary
        run: python scripts/validate_repository.py

      - name: Validate Unreal verification harness
        run: python scripts/validate_unreal_harness.py

      - name: Verify release versions
        run: python scripts/check_release_version.py

      - name: Verify deterministic source packaging
        shell: bash
        run: |
          python scripts/package_plugin.py --output dist/package-a.zip
          python scripts/package_plugin.py --output dist/package-b.zip
          cmp dist/package-a.zip dist/package-b.zip

  unreal-verification-harness:
    name: Unreal verification harness syntax
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell harness
        shell: pwsh
        run: |
          $paths = @(
            'scripts/verify_unreal_windows.ps1',
            'scripts/UnrealVerification/EngineDiscovery.psm1',
            'scripts/UnrealVerification/Execution.psm1'
          )
          $failed = $false
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Check command wrapper
        shell: pwsh
        run: |
          $wrapper = Get-Content scripts/verify_unreal_windows.cmd -Raw
          if ($wrapper -notmatch 'verify_unreal_windows\.ps1') {
            throw 'Command wrapper does not invoke the PowerShell harness.'
          }

  portable-core:
    name: Portable core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizers: ON
          - os: windows-latest
            sanitizers: OFF
          - os: macos-latest
            sanitizers: OFF

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure portable core
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFLICK_PHYSICS_BUILD_BENCHMARKS=ON
          -DFLICK_PHYSICS_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build portable core
        run: cmake --build build --config Release --parallel

      - name: Run portable tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Run CLI smoke test
        run: ctest --test-dir build --build-config Release --output-on-failure -R FlickPhysicsCliSmoke

      - name: Install CMake package
        run: cmake --install build --config Release --prefix install

      - name: Configure external consumer
        run: >-
          cmake -S Tests/Consumer -B consumer-build
          "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/install"

      - name: Build external consumer
        run: cmake --build consumer-build --config Release --parallel

      - name: Run external consumer
        run: ctest --test-dir consumer-build --build-config Release --output-on-failure
